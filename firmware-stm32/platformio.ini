[platformio]
; src_dir is the project root so the FatFs middleware (outside Core/Src)
; can be compiled; build_src_filter below selects exactly what to build.
src_dir = .
include_dir = Core/Inc
; Development default: the short upload-and-monitor command must flash the
; timestamped LoRa trace image. Use -e nucleo_l476rg for the flight image.
default_envs = nucleo_l476rg_lora_trace

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.ldscript = STM32L476RGTX_FLASH_SCV.ld

; Compile application code plus the FatFs middleware (SD logging) and the
; USB CDC device stack (serial-over-USB telemetry) with their glue layers.
build_src_filter =
    +<Core/Src/>
    +<FATFS/App/>
    +<FATFS/Target/>
    +<Middlewares/Third_Party/FatFs/src/>
    +<USB_DEVICE/App/>
    +<USB_DEVICE/Target/>

; Headers for the FatFs API + disk-IO glue and the USB CDC device stack.
build_flags =
    -Wl,-u,_printf_float
    -I FATFS/App
    -I FATFS/Target
    -I Middlewares/Third_Party/FatFs/src
    -I USB_DEVICE/App
    -I USB_DEVICE/Target

; Bench-only build: identical to nucleo_l476rg plus the FDIR_TEST_HOOKS
; fault-injection console (docs/FMECA.md Section 5). Never use this env's
; output as a flight image - flash [env:nucleo_l476rg] for that.
[env:nucleo_l476rg_testhooks]
extends = env:nucleo_l476rg
build_flags =
    ${env:nucleo_l476rg.build_flags}
    -DFDIR_TEST_HOOKS

; Bench-only LoRa tracing. Emits enable/init/TX/fault records plus a measured
; ten-second radio/SPI heartbeat. Normal flight builds remain on the base env.
[env:nucleo_l476rg_lora_trace]
extends = env:nucleo_l476rg
build_flags =
    ${env:nucleo_l476rg.build_flags}
    -DTTC_LORA_TRACE_LOGS=1

; Bench-only SD protocol trace, layered on the non-blocking LoRa trace image.
[env:nucleo_l476rg_sd_trace]
extends = env:nucleo_l476rg_lora_trace
build_flags =
    ${env:nucleo_l476rg_lora_trace.build_flags}
    -DSD_SPI_DEBUG=1
