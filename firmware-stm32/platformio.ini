[platformio]
; src_dir is the project root so the FatFs middleware (outside Core/Src)
; can be compiled; build_src_filter below selects exactly what to build.
src_dir = .
include_dir = Core/Inc

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
board_build.ldscript = STM32L476RGTX_FLASH_SCV.ld

; Compile application code plus the FatFs middleware and its glue layer.
build_src_filter =
    +<Core/Src/>
    +<FATFS/App/>
    +<FATFS/Target/>
    +<Middlewares/Third_Party/FatFs/src/>

; Headers for the FatFs API, its config, and the disk-IO glue.
build_flags =
    -I FATFS/App
    -I FATFS/Target
    -I Middlewares/Third_Party/FatFs/src
