name: TTC and ground-station CI

on:
  push:
  pull_request:

jobs:
  ground-station:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ground test dependencies
        run: >-
          python -m pip install
          fastapi==0.139.0 uvicorn==0.50.0 pydantic==2.13.4 pytest==8.3.5
      - name: Run ground tests
        working-directory: ground-station
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ground-station/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ground-station/frontend
        run: npm ci
      - name: Build frontend
        working-directory: ground-station/frontend
        run: npm run build
      - name: Lint frontend
        working-directory: ground-station/frontend
        run: npm run lint

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install firmware test tools
        run: python -m pip install platformio==6.1.18 pytest==8.3.5
      - name: Run TTC source checks
        run: python -m pytest -q firmware-stm32/tests/ttc/test_ttc_source_contract.py
      - name: Compile and run TTC C harnesses
        run: python firmware-stm32/tests/ttc/run_host_tests.py
      - name: Compile flight configuration (public CI test key only)
        run: pio run -d firmware-stm32 -e nucleo_l476rg
        env:
          # SipHash reference-vector key. Never provision these public values in flight.
          TTC_AUTH_KEY_0: "0x0706050403020100ULL"
          TTC_AUTH_KEY_1: "0x0f0e0d0c0b0a0908ULL"
      - name: Compile fault-injection configuration (public CI test key only)
        run: pio run -d firmware-stm32 -e nucleo_l476rg_testhooks
        env:
          # SipHash reference-vector key. Never provision these public values in flight.
          TTC_AUTH_KEY_0: "0x0706050403020100ULL"
          TTC_AUTH_KEY_1: "0x0f0e0d0c0b0a0908ULL"
